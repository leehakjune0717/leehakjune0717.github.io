<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MY OWN DESIGN 링크</title>
<meta name="description" content="마이온디자인 - 시공 포트폴리오, 상담문의, 인스타그램, 유튜브 링크 모음">
<meta property="og:title" content="MY OWN DESIGN 링크">
<meta property="og:description" content="마이온디자인 - 시공 포트폴리오, 상담문의, 인스타그램, 유튜브 링크 모음">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Noto+Sans+KR:wght@300;400;500;700&display=swap">
<style>
  :root{color-scheme:light dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
  body{margin:0;font:15px system-ui,-apple-system,sans-serif;}
  img{max-width:100%;}
  [hidden]{display:none!important;}
</style>
</head>
<body>
<style>
  :root{
    --sand:#F2E7D5;
    --sand-deep:#E7D2B4;
    --card:#FDF7EA;
    --card-edge:#E0CCAC;
    --ink:#35291C;
    --ink-soft:#8E7551;
    --bulb:#E6EBA4;
    --bulb-edge:#C4CC63;
    --lift:0 10px 24px -16px rgba(90,62,26,.5);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --sand:#1C1611;
      --sand-deep:#261D14;
      --card:#2B2119;
      --card-edge:#453626;
      --ink:#F3E8D6;
      --ink-soft:#B59C78;
      --bulb:#E6EBA4;
      --bulb-edge:#B9C05F;
      --lift:0 10px 26px -16px rgba(0,0,0,.8);
    }
  }
  :root[data-theme="dark"]{
    --sand:#1C1611;
    --sand-deep:#261D14;
    --card:#2B2119;
    --card-edge:#453626;
    --ink:#F3E8D6;
    --ink-soft:#B59C78;
    --bulb:#E6EBA4;
    --bulb-edge:#B9C05F;
    --lift:0 10px 26px -16px rgba(0,0,0,.8);
  }

  body{
    background:var(--sand);
    background-image:radial-gradient(120% 70% at 50% 0%, var(--sand-deep) 0%, var(--sand) 62%);
    background-attachment:fixed;
    color:var(--ink);
    font-family:"Noto Sans KR","Jost",system-ui,-apple-system,"Malgun Gothic",sans-serif;
    font-size:15px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }

  .page{
    max-width:430px;
    margin:0 auto;
    padding-inline:20px;
    padding-block:22px 52px;
    display:flex;
    flex-direction:column;
    gap:26px;
  }

  /* ---- hanging lamp, lifted from the wordmark ---- */
  .lamp{display:block;width:100%;height:82px;overflow:visible;}
  .lamp .cord{fill:none;stroke:var(--ink);stroke-width:2.4;stroke-linecap:round;opacity:.75;}
  .lamp .shade{fill:var(--ink);}
  .lamp .bulb{fill:var(--bulb);}

  header.intro{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
    text-align:center;
    margin-top:-14px;
  }
  .crest{
    width:104px;
    height:104px;
    border-radius:50%;
    background:var(--card);
    border:1px solid var(--card-edge);
    display:grid;
    place-items:center;
    overflow:hidden;
    padding:14px;
    box-shadow:var(--lift);
  }
  .crest img{max-width:100%;max-height:100%;object-fit:contain;}
  .crest .fallback{
    font-family:"Jost",system-ui,sans-serif;
    font-weight:500;
    font-size:15px;
    letter-spacing:.14em;
    line-height:1.25;
    color:var(--ink);
  }
  .crest .fallback small{
    display:block;
    font-size:8px;
    letter-spacing:.42em;
    color:var(--ink-soft);
    margin-top:3px;
  }

  h1{
    font-family:"Jost",system-ui,sans-serif;
    font-weight:400;
    font-size:27px;
    letter-spacing:.2em;
    margin:0;
    text-indent:.2em;
  }
  .tagline{
    margin:0;
    font-size:13.5px;
    font-weight:300;
    color:var(--ink-soft);
    max-width:30ch;
    text-wrap:balance;
  }

  .socials{
    display:flex;
    justify-content:center;
    gap:8px;
  }
  .socials a{
    width:42px;
    height:42px;
    display:grid;
    place-items:center;
    border-radius:50%;
    color:var(--ink);
    border:1px solid transparent;
    transition:background .18s ease, border-color .18s ease;
  }
  .socials a:hover,.socials a:focus-visible{
    background:var(--card);
    border-color:var(--card-edge);
  }
  .socials svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}

  .links{display:flex;flex-direction:column;gap:11px;}
  .link{
    position:relative;
    display:flex;
    align-items:center;
    gap:13px;
    padding:17px 18px;
    background:var(--card);
    border:1px solid var(--card-edge);
    border-radius:2px;
    color:var(--ink);
    text-decoration:none;
    transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  }
  .link:hover,.link:focus-visible{
    transform:translateY(-2px);
    box-shadow:var(--lift);
    border-color:var(--ink-soft);
  }
  .link .ico{
    flex:0 0 auto;
    width:22px;height:22px;
    stroke:currentColor;fill:none;
    stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;
    opacity:.85;
  }
  .link .txt{flex:1 1 auto;min-width:0;}
  .link .txt b{
    display:block;
    font-weight:500;
    font-size:14.5px;
    letter-spacing:-.01em;
  }
  .link .txt span{
    display:block;
    font-family:"Jost",system-ui,sans-serif;
    font-size:10.5px;
    font-weight:300;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-top:2px;
  }
  .link .dot{
    flex:0 0 auto;
    width:8px;height:8px;
    border-radius:50%;
    background:var(--bulb);
    border:1px solid var(--bulb-edge);
    opacity:0;
    transition:opacity .18s ease;
  }
  .link:hover .dot,.link:focus-visible .dot{opacity:1;}

  .link.primary{
    background:var(--ink);
    border-color:var(--ink);
    color:var(--sand);
  }
  /* --sand flips with the theme, so the label stays readable on the dark/light slab */
  .link.primary .txt span{color:var(--sand);opacity:.7;}

  footer{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:7px;
    text-align:center;
    padding-top:6px;
  }
  .rule{
    width:46px;
    height:1px;
    background:var(--card-edge);
  }
  footer a{
    font-family:"Jost",system-ui,sans-serif;
    font-size:14px;
    letter-spacing:.14em;
    color:var(--ink);
    text-decoration:none;
    font-variant-numeric:tabular-nums;
  }
  footer a:hover{text-decoration:underline;}
  footer p{
    margin:0;
    font-family:"Jost",system-ui,sans-serif;
    font-size:9.5px;
    letter-spacing:.3em;
    text-transform:uppercase;
    color:var(--ink-soft);
  }

  a:focus-visible{outline:2px solid var(--ink-soft);outline-offset:3px;}

  @media (prefers-reduced-motion: reduce){
    *{transition:none!important;animation:none!important;}
  }
</style>

<script>
(function(){
  // show the uploaded logo.png when it exists, otherwise keep the typeset mark
  var img = document.getElementById("crest-img");
  var fb = document.getElementById("crest-fallback");
  img.addEventListener("load", function(){
    if (img.naturalWidth > 0){ img.hidden = false; fb.hidden = true; }
  });
  img.addEventListener("error", function(){ img.hidden = true; fb.hidden = false; });
})();
</script>
